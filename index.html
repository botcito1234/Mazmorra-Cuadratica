<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>La Mazmorra de las Cuadráticas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --stone-dark:#14111e;
    --stone:#1e1a2b;
    --stone-light:#2a2438;
    --stone-lighter:#37304a;
    --gold:#e8b84b;
    --gold-bright:#f7d787;
    --gold-dim:#8a6a2a;
    --p1:#e0632f;
    --p1-dim:#5c3220;
    --p2:#3fb896;
    --p2-dim:#204a3e;
    --blood:#d9403f;
    --parchment:#f3e9d2;
    --parchment-dim:#c9bd9e;
    --ink:#221c2f;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(224,99,47,0.10), transparent 55%),
      radial-gradient(ellipse 900px 500px at 85% 105%, rgba(63,184,150,0.10), transparent 55%),
      var(--stone-dark);
    font-family:'Inter', sans-serif;
    color:var(--parchment);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    -webkit-tap-highlight-color:transparent;
  }

  #app{ width:100%; max-width:720px; }

  .marco{
    background:linear-gradient(180deg, var(--stone) 0%, var(--stone-dark) 100%);
    border:3px solid var(--gold-dim);
    border-radius:10px;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.5),
      0 24px 70px rgba(0,0,0,0.55),
      inset 0 0 50px rgba(0,0,0,0.4);
    padding:34px 30px;
    position:relative;
    overflow:hidden;
  }
  .marco::before{
    content:"";
    position:absolute; inset:8px;
    border:1px solid rgba(232,184,75,0.18);
    border-radius:6px;
    pointer-events:none;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--gold-dim); text-align:center; margin-bottom:6px;
  }

  h1.titulo{
    font-family:'Cinzel', serif;
    font-weight:800;
    font-size:clamp(22px, 5.2vw, 32px);
    text-align:center;
    color:var(--gold-bright);
    margin:0 0 4px;
    letter-spacing:.01em;
    text-shadow:0 2px 12px rgba(232,184,75,0.25);
  }

  .subtitulo{
    text-align:center; color:var(--parchment-dim);
    font-size:14px; margin-bottom:26px;
  }

  /* ---- MENU DE MODOS ---- */
  .modo-card{
    display:flex; align-items:center; gap:16px;
    background:var(--stone-light); border:2px solid var(--stone-lighter);
    border-radius:10px; padding:18px 18px; margin-bottom:14px;
    cursor:pointer; text-align:left; width:100%;
    transition:border-color .12s, transform .08s;
    font-family:'Inter',sans-serif; color:var(--parchment);
  }
  .modo-card:hover{ border-color:var(--gold-dim); }
  .modo-card:active{ transform:scale(.99); }
  .modo-card .icono{ font-size:34px; flex-shrink:0; }
  .modo-card .txt h3{ font-family:'Cinzel', serif; margin:0 0 4px; font-size:17px; color:var(--gold-bright); }
  .modo-card .txt p{ margin:0; font-size:13px; color:var(--parchment-dim); line-height:1.4; }

  .campo{ margin-bottom:16px; }
  .campo label{
    display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--parchment-dim); margin-bottom:6px; font-weight:600;
  }
  .campo input{
    width:100%; padding:13px 14px; border-radius:6px;
    border:2px solid var(--stone-lighter); background:var(--stone-dark);
    color:var(--parchment); font-family:'Inter',sans-serif; font-size:16px;
    outline:none; transition:border-color .15s;
  }
  .campo input:focus{ border-color:var(--gold-dim); }
  .campo.p1 input:focus{ border-color:var(--p1); }
  .campo.p2 input:focus{ border-color:var(--p2); }

  .fila-info{ display:flex; gap:16px; margin:22px 0 26px; flex-wrap:wrap; }
  .info-item{
    flex:1; min-width:140px;
    background:var(--stone-light); border:1px solid var(--stone-lighter);
    border-radius:8px; padding:12px 14px;
  }
  .info-item .k{ font-size:11px; color:var(--gold-dim); text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
  .info-item .v{ font-size:13px; color:var(--parchment-dim); margin-top:4px; line-height:1.4; }

  .btn{
    width:100%; padding:16px; border:none; border-radius:8px;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:var(--ink); font-family:'Cinzel', serif; font-weight:700;
    font-size:16px; letter-spacing:.03em; cursor:pointer;
    box-shadow:0 6px 0 var(--gold-dim), 0 10px 24px rgba(0,0,0,0.4);
    transition:transform .08s, box-shadow .08s;
  }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--gold-dim), 0 4px 10px rgba(0,0,0,0.4); }
  .btn:focus-visible{ outline:3px solid var(--parchment); outline-offset:2px; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .btn.secundario{
    background:linear-gradient(180deg, var(--stone-lighter), var(--stone-light));
    color:var(--parchment);
    box-shadow:0 6px 0 var(--stone-dark), 0 10px 24px rgba(0,0,0,0.4);
  }
  .btn.secundario:active{ box-shadow:0 2px 0 var(--stone-dark), 0 4px 10px rgba(0,0,0,0.4); }
  .btn.p1{ background:linear-gradient(180deg, #ef8452, var(--p1)); box-shadow:0 6px 0 var(--p1-dim), 0 10px 24px rgba(0,0,0,0.4); color:#241109;}
  .btn.p2{ background:linear-gradient(180deg, #6bd4b3, var(--p2)); box-shadow:0 6px 0 var(--p2-dim), 0 10px 24px rgba(0,0,0,0.4); color:#0a2b22;}

  .intermezzo{ text-align:center; padding:20px 0; }
  .intermezzo .icono{ font-size:52px; margin-bottom:14px; }
  .intermezzo h2{ font-family:'Cinzel', serif; font-size:24px; margin:0 0 8px; }
  .intermezzo p{ color:var(--parchment-dim); margin:0 0 26px; font-size:14px; }

  .hud{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px; gap:10px; flex-wrap:wrap;
  }
  .hud-jugador{
    font-family:'Cinzel', serif; font-weight:700; font-size:14px;
    display:flex; align-items:center; gap:8px;
  }
  .hud-jugador .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .hud-vidas{ font-size:15px; letter-spacing:2px; }
  .hud-puntaje{ font-family:'JetBrains Mono', monospace; font-size:20px; font-weight:700; }
  .hud-tiempo{
    font-family:'JetBrains Mono', monospace; font-size:20px; font-weight:700;
    padding:5px 12px; border-radius:8px; background:var(--stone-dark);
    border:1px solid var(--stone-lighter); min-width:70px; text-align:center;
  }
  .hud-tiempo.urgente{ color:var(--blood); border-color:var(--blood); animation:pulso 1s infinite; }
  @keyframes pulso{ 0%,100%{opacity:1;} 50%{opacity:.5;} }

  .progreso-salas{
    display:flex; gap:6px; margin-bottom:16px; justify-content:center;
  }
  .progreso-salas .paso{
    width:100%; max-width:44px; height:6px; border-radius:3px;
    background:var(--stone-lighter);
  }
  .progreso-salas .paso.hecho{ background:var(--gold); }
  .progreso-salas .paso.actual{ background:var(--gold-dim); }
  .progreso-salas .paso.jefe{ background:var(--blood); }

  .barra-tiempo-fondo{
    height:8px; border-radius:4px; background:var(--stone-dark);
    border:1px solid rgba(255,255,255,0.06); overflow:hidden; margin-bottom:18px;
  }
  .barra-tiempo{ height:100%; background:linear-gradient(90deg, var(--gold-dim), var(--gold)); transition:width 1s linear; }

  .racha{
    text-align:center; font-family:'JetBrains Mono', monospace; font-size:12px;
    color:var(--gold); margin-bottom:8px; min-height:16px; letter-spacing:.04em;
  }

  .tarjeta-problema{
    background:var(--stone-light); border:1px solid var(--stone-lighter);
    border-radius:10px; padding:24px 20px; margin-bottom:18px;
    text-align:center;
  }
  .tarjeta-problema.jefe{ border-color:var(--gold-dim); background:linear-gradient(180deg, rgba(217,64,63,0.08), var(--stone-light)); }
  .tarjeta-problema.correcto{ border-color:var(--p2); box-shadow:0 0 0 2px rgba(63,184,150,0.3); }
  .tarjeta-problema.incorrecto{ border-color:var(--blood); box-shadow:0 0 0 2px rgba(217,64,63,0.3); animation:shake .35s; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  .problema-etiqueta{
    font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--gold-dim); font-weight:700; margin-bottom:10px;
  }
  .problema-enunciado{
    font-family:'JetBrains Mono', monospace; font-size:clamp(19px, 5.5vw, 25px);
    font-weight:700; color:var(--parchment); line-height:1.5;
  }
  .problema-nota{ font-size:13px; color:var(--parchment-dim); margin-top:8px; font-family:'Inter',sans-serif; }

  .zona-respuesta{ display:flex; gap:10px; margin-bottom:8px; }
  .zona-respuesta input{
    flex:1; padding:15px 14px; border-radius:8px;
    border:2px solid var(--stone-lighter); background:var(--stone-dark);
    color:var(--parchment); font-family:'JetBrains Mono', monospace;
    font-size:18px; text-align:center; outline:none;
    transition:border-color .12s, background .12s;
  }
  .zona-respuesta input:focus{ border-color:var(--gold-dim); }
  .zona-respuesta input.correcto{ border-color:var(--p2); background:rgba(63,184,150,0.14); }
  .zona-respuesta input.incorrecto{ border-color:var(--blood); background:rgba(217,64,63,0.14); }
  .zona-respuesta button{
    flex-shrink:0; padding:0 22px; border:none; border-radius:8px;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:var(--ink); font-family:'Cinzel', serif; font-weight:700; font-size:14px;
    cursor:pointer;
  }
  .zona-respuesta button:disabled{ opacity:.4; cursor:default; }

  .respuesta-correcta-txt{
    text-align:center; font-size:13px; color:var(--parchment-dim); min-height:18px; margin-bottom:6px;
  }
  .respuesta-correcta-txt b{ color:var(--p2); }

  .resultado-corona{ text-align:center; font-size:52px; margin-bottom:6px; }
  .resultado-titulo{
    font-family:'Cinzel', serif; font-weight:800; font-size:24px;
    text-align:center; color:var(--gold-bright); margin-bottom:4px;
  }
  .resultado-sub{ text-align:center; color:var(--parchment-dim); font-size:14px; margin-bottom:22px; }

  .tabla-resultado{ display:flex; gap:14px; margin-bottom:22px; }
  .tarjeta-jugador{
    flex:1; border-radius:10px; padding:18px 14px; text-align:center;
    background:var(--stone-light); border:2px solid var(--stone-lighter);
  }
  .tarjeta-jugador.ganador{ border-color:var(--gold); background:linear-gradient(180deg, rgba(232,184,75,0.12), var(--stone-light)); }
  .tarjeta-jugador .nombre{ font-family:'Cinzel', serif; font-weight:700; font-size:15px; margin-bottom:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tarjeta-jugador .puntaje{ font-family:'JetBrains Mono', monospace; font-size:30px; font-weight:700; margin-bottom:10px; }
  .tarjeta-jugador .detalle{ font-size:12px; color:var(--parchment-dim); line-height:1.7; text-align:left; padding:0 4px; }
  .tarjeta-jugador .detalle b{ color:var(--parchment); }

  .botonera{ display:flex; gap:10px; }
  .botonera .btn{ flex:1; }

  /* ---- MODO ÉPICO: jefe con HP, poderes, logros ---- */
  .jefe-hp-wrap{ margin-bottom:14px; }
  .jefe-hp-etiqueta{
    display:flex; justify-content:space-between; font-size:11px;
    text-transform:uppercase; letter-spacing:.06em; color:var(--gold-dim);
    font-weight:700; margin-bottom:4px;
  }
  .jefe-hp-fondo{
    display:flex; gap:4px; height:16px;
  }
  .jefe-hp-seg{
    flex:1; border-radius:4px; background:var(--blood);
    border:1px solid rgba(0,0,0,0.3);
    transition:background .3s, transform .2s;
  }
  .jefe-hp-seg.caido{ background:var(--stone-lighter); }
  .jefe-hp-wrap.impacto .jefe-hp-fondo{ animation:golpeJefe .3s; }
  @keyframes golpeJefe{ 0%,100%{transform:translateX(0);} 30%{transform:translateX(3px);} 60%{transform:translateX(-3px);} }
  .dano-flotante{
    text-align:center; font-family:'Cinzel',serif; font-weight:800; font-size:18px;
    color:var(--p2); min-height:22px; margin-bottom:4px;
  }

  .poderes{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .poder-btn{
    flex:1; min-width:76px; padding:10px 6px; border-radius:8px;
    border:2px solid var(--stone-lighter); background:var(--stone-light);
    color:var(--parchment); font-family:'Inter',sans-serif; font-size:11px; font-weight:600;
    cursor:pointer; text-align:center; line-height:1.3;
    transition:border-color .12s, transform .08s;
  }
  .poder-btn .emoji{ font-size:18px; display:block; margin-bottom:2px; }
  .poder-btn:hover:not(:disabled){ border-color:var(--gold-dim); }
  .poder-btn:active:not(:disabled){ transform:scale(.95); }
  .poder-btn:disabled{ opacity:.3; cursor:default; }

  .pista-texto{
    text-align:center; font-size:13px; color:var(--gold-bright);
    background:rgba(232,184,75,0.08); border:1px dashed var(--gold-dim);
    border-radius:6px; padding:8px 10px; margin-top:10px;
  }

  .logros{ margin:6px 0 22px; }
  .logro-item{
    display:flex; align-items:center; gap:10px;
    background:var(--stone-light); border:1px solid var(--stone-lighter);
    border-radius:8px; padding:10px 14px; margin-bottom:8px;
    font-size:13px;
  }
  .logro-item .emoji{ font-size:20px; flex-shrink:0; }

  .tarjeta-iq{
    background:linear-gradient(180deg, rgba(232,184,75,0.10), var(--stone-light));
    border:2px solid var(--gold-dim); border-radius:10px;
    padding:16px 18px; margin-bottom:20px; text-align:center;
  }
  .tarjeta-iq .k{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--gold-dim); font-weight:700; margin-bottom:4px; }
  .tarjeta-iq .valor{ font-family:'Cinzel',serif; font-weight:800; font-size:26px; color:var(--gold-bright); }
  .tarjeta-iq .etiqueta{ font-size:13px; color:var(--parchment-dim); margin-top:2px; }
  .tarjeta-iq .nota{ font-size:10px; color:var(--parchment-dim); opacity:.7; margin-top:8px; font-style:italic; }
  .tarjeta-iq.doble{ display:flex; gap:14px; text-align:left; align-items:center; }
  .tarjeta-iq.doble .lado{ flex:1; text-align:center; }

  /* ---- MODO TORNEO ---- */
  .jugadores-lista{ margin-bottom:16px; }
  .jugador-fila{
    display:flex; align-items:center; gap:10px; margin-bottom:10px;
  }
  .jugador-fila input{
    flex:1; padding:12px 14px; border-radius:6px;
    border:2px solid var(--stone-lighter); background:var(--stone-dark);
    color:var(--parchment); font-family:'Inter',sans-serif; font-size:15px; outline:none;
  }
  .jugador-fila input:focus{ border-color:var(--gold-dim); }
  .jugador-fila .num{
    width:26px; text-align:center; font-family:'JetBrains Mono',monospace;
    color:var(--gold-dim); font-weight:700; flex-shrink:0;
  }
  .jugador-fila .quitar{
    flex-shrink:0; width:34px; height:34px; border-radius:6px; border:none;
    background:var(--stone-lighter); color:var(--parchment-dim); cursor:pointer; font-size:15px;
  }
  .btn-agregar-jugador{
    width:100%; padding:11px; border-radius:6px; border:2px dashed var(--stone-lighter);
    background:transparent; color:var(--parchment-dim); font-family:'Inter',sans-serif;
    font-size:13px; cursor:pointer; margin-bottom:18px;
  }
  .btn-agregar-jugador:hover{ border-color:var(--gold-dim); color:var(--gold-bright); }

  .bracket-ronda-titulo{
    font-family:'Cinzel',serif; font-weight:700; font-size:15px; color:var(--gold-bright);
    text-align:center; margin-bottom:14px;
  }
  .bracket-lista{ margin-bottom:20px; }
  .bracket-match{
    background:var(--stone-light); border:1px solid var(--stone-lighter);
    border-radius:8px; padding:12px 14px; margin-bottom:10px;
  }
  .bracket-match .vs-fila{
    display:flex; align-items:center; justify-content:space-between; font-size:14px; padding:4px 0;
  }
  .bracket-match .vs-fila.ganador{ color:var(--gold-bright); font-weight:700; }
  .bracket-match .vs-fila .pts{ font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--parchment-dim); }
  .bracket-match .vs-sep{ text-align:center; font-size:10px; color:var(--parchment-dim); letter-spacing:.1em; padding:2px 0; }
  .bracket-match.pendiente{ opacity:.55; }
  .bracket-match .bye{ font-size:11px; color:var(--parchment-dim); font-style:italic; text-align:center; padding:4px 0; }

  .campeon-box{
    text-align:center; background:linear-gradient(180deg, rgba(232,184,75,0.14), var(--stone-light));
    border:2px solid var(--gold); border-radius:10px; padding:24px 18px; margin-bottom:20px;
  }
  .campeon-box .corona{ font-size:44px; margin-bottom:8px; }
  .campeon-box .nombre{ font-family:'Cinzel',serif; font-weight:800; font-size:22px; color:var(--gold-bright); }
  .campeon-box .sub{ font-size:13px; color:var(--parchment-dim); margin-top:4px; }

  .muerte-subita-banner{
    text-align:center; background:rgba(217,64,63,0.12); border:1px solid var(--blood);
    border-radius:8px; padding:10px 14px; margin-bottom:16px; font-size:13px; color:var(--parchment);
  }

  /* ---- ESCENA DE ENTRADA AL JEFE FINAL ---- */
  .jefe-intro{
    text-align:center; padding:10px 0 4px;
    position:relative;
  }
  .jefe-intro::before{
    content:"";
    position:absolute; inset:-34px -30px auto -30px; height:220px;
    background:radial-gradient(ellipse at center, rgba(217,64,63,0.22), transparent 70%);
    pointer-events:none; z-index:0;
  }
  .jefe-intro .grieta{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.3em;
    color:var(--blood); text-transform:uppercase; margin-bottom:6px; position:relative;
    animation:parpadeo 1.6s infinite;
  }
  @keyframes parpadeo{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .jefe-intro .criatura{
    font-size:76px; margin:8px 0 10px; position:relative;
    animation:aparicionJefe .7s cubic-bezier(.2,.8,.2,1), respirarJefe 2.4s ease-in-out infinite .7s;
    filter:drop-shadow(0 0 18px rgba(217,64,63,0.5));
  }
  @keyframes aparicionJefe{
    0%{ transform:scale(.3) translateY(30px); opacity:0; }
    60%{ transform:scale(1.15) translateY(-6px); opacity:1; }
    100%{ transform:scale(1) translateY(0); }
  }
  @keyframes respirarJefe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
  .jefe-intro .nombre-jefe{
    font-family:'Cinzel',serif; font-weight:800; font-size:clamp(22px,6vw,30px);
    color:var(--blood); text-shadow:0 0 18px rgba(217,64,63,0.55), 0 2px 4px rgba(0,0,0,0.6);
    margin-bottom:6px; position:relative; letter-spacing:.02em;
  }
  .jefe-intro .titulo-jefe{
    font-family:'Cinzel',serif; font-size:13px; color:var(--gold-dim);
    text-transform:uppercase; letter-spacing:.12em; margin-bottom:16px; position:relative;
  }
  .jefe-intro .flavor{
    font-size:14px; color:var(--parchment-dim); line-height:1.6; max-width:480px;
    margin:0 auto 20px; position:relative;
  }
  .jefe-intro .stats-jefe{
    display:flex; gap:10px; justify-content:center; margin-bottom:22px; position:relative; flex-wrap:wrap;
  }
  .jefe-intro .stat-chip{
    background:rgba(217,64,63,0.1); border:1px solid var(--blood); border-radius:20px;
    padding:6px 14px; font-size:12px; color:var(--parchment); font-family:'JetBrains Mono',monospace;
  }
  .btn.combate{
    background:linear-gradient(180deg, #f0715a, var(--blood));
    box-shadow:0 6px 0 #7a1f1f, 0 10px 24px rgba(0,0,0,0.4); color:#2a0d0d;
    position:relative;
  }
  .btn.combate:active{ box-shadow:0 2px 0 #7a1f1f, 0 4px 10px rgba(0,0,0,0.4); }

  .jefe-banner{
    display:flex; align-items:center; gap:8px; justify-content:center;
    background:rgba(217,64,63,0.08); border:1px solid rgba(217,64,63,0.4);
    border-radius:8px; padding:6px 10px; margin-bottom:12px;
    font-family:'Cinzel',serif; font-size:12px; color:var(--blood); letter-spacing:.04em;
  }

<body>
<div id="app"><div class="marco" id="marco"></div></div>

<script>
const marco = document.getElementById('marco');
const DURACION_PARTIDA = 360; // 6 minutos
const VIDAS_INICIALES = 3;
let temporizadorId = null;

const estado = { nombre1:'Jugador 1', nombre2:'Jugador 2', resultados:{1:null, 2:null} };

function limpiarTemporizador(){ if(temporizadorId){ clearInterval(temporizadorId); temporizadorId = null; } }

/* ===================== HELPERS ===================== */
function entero(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function elegir(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function esCuadradoPerfecto(n){ if(n<0) return false; const r=Math.round(Math.sqrt(n)); return r*r===n; }
function ecuacionTexto(a,b,c){
  let s = '';
  s += (a===1?'':a===-1?'-':a) + 'x²';
  if(b!==0) s += (b>0?' + ':' − ') + (Math.abs(b)===1?'':Math.abs(b)) + 'x';
  if(c!==0) s += (c>0?' + ':' − ') + Math.abs(c);
  s += ' = 0';
  return s;
}

/* ===================== GENERADORES POR SALA ===================== */

function genSala1(facil){ // raices enteras, rango pequeño
  const rango = facil ? 4 : 6;
  let r1=entero(-rango,rango), r2=entero(-rango,rango);
  if(r1===0) r1=1; if(r2===0) r2=2;
  const b=-(r1+r2), c=r1*r2;
  return { etiqueta:'Sala 1 de 5 · Raíces enteras', enunciado:ecuacionTexto(1,b,c),
    nota:'Escribe ambas raíces separadas por coma. Ej: -2, 5',
    tipoResp:'raices', respuesta:[r1,r2], formatoCorrecta:`${r1} y ${r2}`, puntos:100 };
}

function genSala2(facil){ // raices enteras rango mayor
  const rango = facil ? 7 : 12;
  let r1=entero(-rango,rango), r2=entero(-rango,rango);
  if(r1===0) r1=4; if(r2===0) r2=-5;
  const b=-(r1+r2), c=r1*r2;
  return { etiqueta:'Sala 2 de 5 · Raíces enteras (rango mayor)', enunciado:ecuacionTexto(1,b,c),
    nota:'Escribe ambas raíces separadas por coma. Ej: -2, 5',
    tipoResp:'raices', respuesta:[r1,r2], formatoCorrecta:`${r1} y ${r2}`, puntos:130 };
}

function genSala3(facil){ // decimal: a=1, discriminante no cuadrado perfecto
  const rango = facil ? 6 : 9;
  let b,c,d,intentos=0;
  do{ b=entero(-rango,rango); c=entero(-rango,rango); d=b*b-4*c; intentos++; }
  while((d<=0 || esCuadradoPerfecto(d)) && intentos<60);
  const raizD=Math.sqrt(Math.max(d,1));
  const r1=Math.round(((-b+raizD)/2)*100)/100;
  return { etiqueta:'Sala 3 de 5 · Raíz con decimales', enunciado:ecuacionTexto(1,b,c),
    nota:'Escribe una de sus raíces con 2 decimales. x = (−b ± √Δ) / 2',
    tipoResp:'decimal', respuesta:r1, formatoCorrecta:r1.toFixed(2), puntos:160 };
}

function genSala4(facil){ // vertice; en modo fácil siempre entero (b par)
  const rango = facil ? 6 : 9;
  let b = entero(-rango,rango);
  if(facil){ if(b%2!==0) b += 1; if(b===0) b=2; }
  else if(b===0) b=3;
  const c = entero(-rango,rango);
  const xv = Math.round((-b/2)*100)/100;
  const yv = Math.round((xv*xv + b*xv + c)*100)/100;
  return { etiqueta:'Sala 4 de 5 · Vértice de la parábola', enunciado:ecuacionTexto(1,b,c),
    nota: facil ? 'Escribe el vértice como x, y. Ej: -2, 4' : 'Escribe el vértice como x, y (usa decimales si hace falta). Ej: -1.5, 4',
    tipoResp:'punto', respuesta:[xv,yv], formatoCorrecta:`(${xv}, ${yv})`, puntos:190 };
}

function genSala5(facil){ // a != 1, suma o producto
  const a = facil ? elegir([2,2,3]) : elegir([2,3,4]);
  const rango = facil ? 6 : 10;
  const b = entero(-rango,rango), c = entero(-rango,rango);
  const pedirSuma = Math.random()<0.5;
  const correcta = Math.round((pedirSuma ? -b/a : c/a)*100)/100;
  return { etiqueta:`Sala 5 de 5 · ${pedirSuma?'Suma':'Producto'} de raíces (a ≠ 1)`, enunciado:ecuacionTexto(a,b,c),
    nota: pedirSuma ? 'suma = −b/a · responde con 2 decimales' : 'producto = c/a · responde con 2 decimales',
    tipoResp:'decimal', respuesta:correcta, formatoCorrecta:correcta.toFixed(2), puntos:220 };
}

const GENERADORES_SALA = [genSala1, genSala2, genSala3, genSala4, genSala5];

// ---- JEFE FINAL (nivel 5to de secundaria; se suaviza un poco en modo fácil) ----
function generarEcuacionJefe(facil){
  const a = facil ? elegir([2,2,3]) : elegir([2,3,4]);
  const rango = facil ? 6 : 9;
  let b,c,d,intentos=0;
  if(facil){
    do{ b=entero(-rango,rango); c=entero(-rango,rango); d=b*b-4*a*c; intentos++; }
    while(d<0 && intentos<80); // en fácil se permite raíz cuadrada perfecta (números más simples)
  } else {
    do{ b=entero(-rango,rango); c=entero(-rango,rango); d=b*b-4*a*c; intentos++; }
    while((d<0 || esCuadradoPerfecto(d)) && intentos<80);
  }
  return {a,b,c,d};
}
function problemaJefeFase1(eq, idx){
  return { etiqueta:`👑 Jefe Final · Fase 1: Discriminante (${idx+1} de 4)`, enunciado:ecuacionTexto(eq.a,eq.b,eq.c),
    nota:'Calcula Δ = b² − 4ac', tipoResp:'numero', respuesta:eq.d, formatoCorrecta:String(eq.d), puntos:110 };
}
function problemaJefeFase2(eq, idx){
  const raizD = Math.sqrt(eq.d);
  const r1 = Math.round(((-eq.b+raizD)/(2*eq.a))*100)/100;
  return { etiqueta:`👑 Jefe Final · Fase 2: Fórmula general (${idx+1} de 4)`, enunciado:ecuacionTexto(eq.a,eq.b,eq.c),
    nota:`Halla una raíz con 2 decimales. x = (−b ± √Δ) / 2a   (Δ = ${eq.d})`,
    tipoResp:'decimal', respuesta:r1, formatoCorrecta:r1.toFixed(2), puntos:150 };
}

/* ===================== VALIDACIÓN ===================== */
function numerosDesdeTexto(txt){
  return txt.split(/[,;yY]+/).map(s=>parseFloat(s.trim().replace(',','.'))).filter(n=>!isNaN(n));
}
function validarRespuesta(p, textoUsuario){
  const txt = textoUsuario.trim();
  if(txt==='') return false;
  if(p.tipoResp==='raices' || p.tipoResp==='punto'){
    const nums = numerosDesdeTexto(txt);
    if(nums.length<2) return false;
    const [a,b] = nums; const [ca,cb] = p.respuesta;
    const directa = Math.abs(a-ca)<0.06 && Math.abs(b-cb)<0.06;
    const cruzada = p.tipoResp==='raices' && Math.abs(a-cb)<0.06 && Math.abs(b-ca)<0.06;
    return directa || cruzada;
  }
  if(p.tipoResp==='numero'){
    const n = parseFloat(txt.replace(',','.'));
    return !isNaN(n) && Math.abs(n-p.respuesta)<0.01;
  }
  if(p.tipoResp==='decimal'){
    const n = parseFloat(txt.replace(',','.'));
    return !isNaN(n) && Math.abs(n-p.respuesta)<0.06;
  }
  return false;
}

/* ===================== MODO TORNEO ===================== */

const torneo = { jugadores:[], ronda:[], numeroRonda:1, historial:[] };

function pantallaInicioTorneo(){
  if(torneo.jugadores.length < 3){
    torneo.jugadores = ['', '', ''];
  }
  renderInicioTorneo();
}

function renderInicioTorneo(){
  const filas = torneo.jugadores.map((nom,i) => `
    <div class="jugador-fila">
      <span class="num">${i+1}</span>
      <input type="text" class="in-jugador-torneo" data-i="${i}" maxlength="16" placeholder="Nombre del retador ${i+1}" value="${escapeHtml(nom)}">
      ${torneo.jugadores.length>3 ? `<button class="quitar" data-i="${i}">✕</button>` : ''}
    </div>
  `).join('');

  marco.innerHTML = `
    <div class="eyebrow">Modo Torneo</div>
    <h1 class="titulo">🏆 Torneo de la Mazmorra</h1>
    <div class="subtitulo">De 3 a 8 retadores. Llaves de eliminación directa, muerte súbita en empates.</div>

    <div class="jugadores-lista" id="listaJugadores">${filas}</div>
    ${torneo.jugadores.length<8 ? `<button class="btn-agregar-jugador" id="btnAgregarJugador">+ Agregar otro retador</button>` : ''}

    ${infoPartidaHTML()}

    <button class="btn" id="btnComenzarTorneo">Generar llaves y comenzar</button>
    <div style="height:10px"></div>
    <button class="btn secundario" id="btnVolver">← Volver al menú</button>
  `;

  document.getElementById('btnVolver').onclick = pantallaMenuPrincipal;
  document.querySelectorAll('.in-jugador-torneo').forEach(inp=>{
    inp.oninput = () => { torneo.jugadores[parseInt(inp.dataset.i)] = inp.value; };
  });
  document.querySelectorAll('.jugador-fila .quitar').forEach(btn=>{
    btn.onclick = () => { torneo.jugadores.splice(parseInt(btn.dataset.i),1); renderInicioTorneo(); };
  });
  const btnAgregar = document.getElementById('btnAgregarJugador');
  if(btnAgregar) btnAgregar.onclick = () => { torneo.jugadores.push(''); renderInicioTorneo(); };

  document.getElementById('btnComenzarTorneo').onclick = () => {
    const nombres = torneo.jugadores.map((n,i)=>n.trim()||`Retador ${i+1}`);
    iniciarTorneo(nombres);
  };
}

function iniciarTorneo(nombres){
  // barajar orden para que las llaves no dependan del orden de inscripción
  const barajados = nombres.slice();
  for(let i=barajados.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [barajados[i],barajados[j]]=[barajados[j],barajados[i]]; }

  torneo.ronda = barajados.map(n => ({nombre:n, eliminado:false}));
  torneo.numeroRonda = 1;
  torneo.historial = [];
  jugarRonda();
}

function nombreRonda(cantidadJugadores){
  if(cantidadJugadores<=2) return 'Gran Final';
  if(cantidadJugadores<=4) return 'Semifinal';
  if(cantidadJugadores<=8) return 'Cuartos de Final';
  return `Ronda de ${cantidadJugadores}`;
}

function jugarRonda(){
  const jugadores = torneo.ronda;
  if(jugadores.length===1){
    pantallaCampeonTorneo(jugadores[0].nombre);
    return;
  }

  // armar emparejamientos; si es impar, el último pasa directo (bye)
  const emparejamientos = [];
  let i=0;
  for(; i+1<jugadores.length; i+=2){
    emparejamientos.push({a:jugadores[i], b:jugadores[i+1], resA:null, resB:null, ganador:null, muerteSubita:false});
  }
  if(i<jugadores.length){
    emparejamientos.push({a:jugadores[i], b:null, resA:null, resB:null, ganador:jugadores[i].nombre, bye:true});
  }

  torneo.emparejamientos = emparejamientos;
  torneo.indiceMatch = 0;
  pantallaBracketRonda();
}

function pantallaBracketRonda(){
  const nombreEtapa = nombreRonda(torneo.ronda.length);
  const emp = torneo.emparejamientos;

  const filas = emp.map((m,idx) => {
    if(m.bye){
      return `<div class="bracket-match"><div class="vs-fila ganador">${escapeHtml(m.a.nombre)}</div><div class="bye">Pasa directo (sin rival)</div></div>`;
    }
    const jugado = m.ganador!==null;
    const pts = (x)=> x===null ? '' : `<span class="pts">${x} pts</span>`;
    return `
      <div class="bracket-match ${jugado?'':'pendiente'}">
        <div class="vs-fila ${m.ganador===m.a.nombre?'ganador':''}"><span>${escapeHtml(m.a.nombre)}</span>${pts(m.resA)}</div>
        <div class="vs-sep">VS</div>
        <div class="vs-fila ${m.ganador===m.b.nombre?'ganador':''}"><span>${escapeHtml(m.b.nombre)}</span>${pts(m.resB)}</div>
        ${m.muerteSubita ? '<div class="bye">⚡ Decidido por muerte súbita</div>' : ''}
      </div>
    `;
  }).join('');

  const siguientePendiente = emp.findIndex(m => !m.bye && m.ganador===null);

  marco.innerHTML = `
    <div class="eyebrow">Torneo · ${nombreEtapa}</div>
    <h1 class="titulo">🏆 Llaves del Torneo</h1>
    <div class="bracket-ronda-titulo">${jugadores_restantes_txt()}</div>
    <div class="bracket-lista">${filas}</div>
    ${siguientePendiente>=0
      ? `<button class="btn" id="btnJugarMatch">Jugar: ${escapeHtml(emp[siguientePendiente].a.nombre)} vs ${escapeHtml(emp[siguientePendiente].b.nombre)}</button>`
      : `<button class="btn" id="btnSiguienteRonda">Continuar a la siguiente ronda →</button>`}
    <div style="height:10px"></div>
    <button class="btn secundario" id="btnVolver">← Salir del torneo</button>
  `;
  document.getElementById('btnVolver').onclick = pantallaMenuPrincipal;

  if(siguientePendiente>=0){
    document.getElementById('btnJugarMatch').onclick = () => jugarMatch(siguientePendiente);
  } else {
    document.getElementById('btnSiguienteRonda').onclick = () => {
      torneo.ronda = emp.map(m => ({nombre:m.ganador, eliminado:false}));
      torneo.numeroRonda++;
      jugarRonda();
    };
  }
}

function jugadores_restantes_txt(){
  return `${torneo.ronda.length} retadores en esta ronda`;
}

function jugarMatch(indice){
  const m = torneo.emparejamientos[indice];
  pantallaIntermezzoTorneo(m.a.nombre, 'p1', '🗡️', () => {
    iniciarPartida(m.a.nombre, 'p1', (sesionA) => {
      m.resA = sesionA.puntaje; m._sesionA = sesionA;
      pantallaIntermezzoTorneo(m.b.nombre, 'p2', '🛡️', () => {
        iniciarPartida(m.b.nombre, 'p2', (sesionB) => {
          m.resB = sesionB.puntaje; m._sesionB = sesionB;
          resolverMatch(m, indice);
        });
      });
    });
  });
}

function resolverMatch(m, indice){
  if(m.resA === m.resB){
    pantallaMuerteSubita(m, indice);
    return;
  }
  m.ganador = m.resA > m.resB ? m.a.nombre : m.b.nombre;
  pantallaBracketRonda();
}

function pantallaIntermezzoTorneo(nombre, color, icono, onListo){
  limpiarTemporizador();
  marco.innerHTML = `
    <div class="intermezzo">
      <div class="icono">${icono}</div>
      <h2 style="color:var(--${color})">Turno de ${escapeHtml(nombre)}</h2>
      <p>Recorre las 5 salas y el jefe final. Tu puntaje decide si avanzas en el torneo.</p>
      <button class="btn ${color}" id="btnListo">Estoy listo</button>
    </div>
  `;
  document.getElementById('btnListo').onclick = onListo;
}

function pantallaMuerteSubita(m, indice){
  marco.innerHTML = `
    <div class="eyebrow">Torneo · Empate</div>
    <h1 class="titulo">⚡ Muerte Súbita</h1>
    <div class="muerte-subita-banner">${escapeHtml(m.a.nombre)} y ${escapeHtml(m.b.nombre)} empataron en ${m.resA} pts. Una sola pregunta decide quién avanza.</div>
    <button class="btn" id="btnMuerteSubita">Comenzar muerte súbita</button>
    <div style="height:10px"></div>
    <button class="btn secundario" id="btnVolver">← Salir del torneo</button>
  `;
  document.getElementById('btnVolver').onclick = pantallaMenuPrincipal;
  document.getElementById('btnMuerteSubita').onclick = () => jugarMuerteSubita(m, indice, m.a.nombre, m.b.nombre);
}

function jugarMuerteSubita(m, indice, turnoA, turnoB){
  const p = elegir(GENERADORES_SALA)();
  let respuestaA = null;

  function turno(nombre, color, alTerminar){
    marco.innerHTML = `
      <div class="hud">
        <div class="hud-jugador"><span class="dot" style="background:var(--${color})"></span>${escapeHtml(nombre)}</div>
      </div>
      <div class="muerte-subita-banner">⚡ Muerte súbita — una sola pregunta, respuesta más rápida y correcta gana</div>
      <div class="tarjeta-problema" id="tarjeta">
        <div class="problema-etiqueta">${p.etiqueta}</div>
        <div class="problema-enunciado">${p.enunciado}</div>
        ${p.nota ? `<div class="problema-nota">${p.nota}</div>` : ''}
      </div>
      <div class="zona-respuesta">
        <input type="text" id="inputResp" autocomplete="off" placeholder="Escribe tu respuesta...">
        <button id="btnResponder">Verificar</button>
      </div>
      <div class="respuesta-correcta-txt" id="textoCorrecta"></div>
    `;
    const input = document.getElementById('inputResp');
    const inicio = Date.now();
    input.focus();
    const enviar = () => {
      if(input.disabled) return;
      if(input.value.trim()==='') { input.focus(); return; }
      const ok = validarRespuesta(p, input.value);
      const tiempo = (Date.now()-inicio)/1000;
      input.disabled = true;
      document.getElementById('btnResponder').disabled = true;
      document.getElementById('tarjeta').classList.add(ok?'correcto':'incorrecto');
      input.classList.add(ok?'correcto':'incorrecto');
      if(!ok) document.getElementById('textoCorrecta').innerHTML = `Respuesta correcta: <b>${escapeHtml(p.formatoCorrecta)}</b>`;
      setTimeout(()=> alTerminar(ok, tiempo), 900);
    };
    document.getElementById('btnResponder').onclick = enviar;
    input.onkeydown = (e) => { if(e.key==='Enter') enviar(); };
  }

  turno(turnoA, 'p1', (okA, tiempoA) => {
    turno(turnoB, 'p2', (okB, tiempoB) => {
      let ganador;
      if(okA && !okB) ganador = turnoA;
      else if(okB && !okA) ganador = turnoB;
      else if(okA && okB) ganador = tiempoA<=tiempoB ? turnoA : turnoB;
      else ganador = tiempoA<=tiempoB ? turnoA : turnoB; // ambos fallan: gana quien respondió más rápido
      m.ganador = ganador;
      m.muerteSubita = true;
      pantallaBracketRonda();
    });
  });
}

/* ---- Sonidos simples generados en el navegador (sin archivos externos) ---- */
let __audioCtx = null;
function sonido(tipo){
  try{
    if(!__audioCtx) __audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const ctx = __audioCtx;
    const ahora = ctx.currentTime;
    function tono(freq, inicio, dur, vol, tipoOnda){
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = tipoOnda||'sine'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, ahora+inicio);
      gain.gain.exponentialRampToValueAtTime(0.001, ahora+inicio+dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ahora+inicio); osc.stop(ahora+inicio+dur+0.02);
    }
    if(tipo==='correcto'){ tono(660,0,0.09,0.12); tono(990,0.09,0.12,0.12); }
    else if(tipo==='incorrecto'){ tono(160,0,0.22,0.14,'sawtooth'); }
    else if(tipo==='victoria'){ [523,659,784,1047].forEach((f,i)=>tono(f,i*0.12,0.18,0.12)); }
    else if(tipo==='derrota'){ tono(300,0,0.2,0.12,'sawtooth'); tono(200,0.18,0.3,0.12,'sawtooth'); }
    else if(tipo==='poder'){ tono(880,0,0.08,0.1); tono(1320,0.08,0.1,0.1); }
    else if(tipo==='rugido'){ tono(90,0,0.5,0.16,'sawtooth'); tono(70,0.15,0.45,0.14,'sawtooth'); }
  }catch(e){ /* audio no disponible, seguimos sin sonido */ }
}

const JEFE_FINAL = {
  nombre: 'Discriminante, el Devorador de Fórmulas',
  titulo: 'Guardián de la Cámara Final',
  criatura: '🐉',
  flavor: 'El suelo tiembla. Una bestia forjada de coeficientes olvidados bloquea la salida de la mazmorra — solo quien domine el discriminante y la fórmula general podrá derrotarla.',
};

function iniciarPartida(nombre, color, onFinish, opts){
  opts = opts || {};
  const epico = !!opts.epico;
  const facil = !!opts.facil;
  const vidasIniciales = facil ? VIDAS_INICIALES + 1 : VIDAS_INICIALES;
  const sesion = {
    sala:1, faseJefe:0, jefeSubIndice:0, introJefeMostrada:false, vidas:vidasIniciales, vidasMax:vidasIniciales, puntaje:0, aciertos:0, errores:0,
    racha:0, rachaMax:0, tiempoRestante: DURACION_PARTIDA, victoria:false, bossEq:null,
    epico, facil, powerupsUsados:0,
    poderes: epico ? {pista:1, pausa:1, pocion:1, doble:1} : null,
    dobleActivo:false,
  };

  function renderProgreso(){
    let html = '';
    for(let i=1;i<=5;i++){
      const cls = i<sesion.sala ? 'hecho' : (i===sesion.sala ? 'actual' : '');
      html += `<div class="paso ${cls}"></div>`;
    }
    const clsJefe = sesion.sala>5 ? (sesion.victoria?'hecho':'jefe') : '';
    html += `<div class="paso ${clsJefe}"></div>`;
    return html;
  }

  function renderBarraJefe(){
    if(!epico || sesion.sala<=5) return '';
    const totalSeg = 8;
    const numCaidos = sesion.victoria ? 8 : (sesion.faseJefe===1 ? sesion.jefeSubIndice : 4+sesion.jefeSubIndice);
    let segs = '';
    for(let i=0;i<totalSeg;i++){ segs += `<div class="jefe-hp-seg ${i<numCaidos?'caido':''}"></div>`; }
    return `
      <div class="jefe-hp-wrap" id="jefeHpWrap">
        <div class="jefe-hp-etiqueta"><span>👑 Vida del Jefe</span><span>Fase ${Math.min(sesion.faseJefe,2)}/2 · Golpe ${Math.min(numCaidos+1,8)}/8</span></div>
        <div class="jefe-hp-fondo">${segs}</div>
      </div>
      <div class="dano-flotante" id="danoFlotante"></div>
    `;
  }

  function renderPoderes(){
    if(!epico) return '';
    const p = sesion.poderes;
    return `
      <div class="poderes">
        <button class="poder-btn" id="poderPista" ${p.pista<1?'disabled':''}><span class="emoji">🔍</span>Pista</button>
        <button class="poder-btn" id="poderPausa" ${p.pausa<1?'disabled':''}><span class="emoji">⏱️</span>+15 seg</button>
        <button class="poder-btn" id="poderPocion" ${p.pocion<1 || sesion.vidas>=sesion.vidasMax?'disabled':''}><span class="emoji">❤️</span>Poción</button>
        <button class="poder-btn" id="poderDoble" ${p.doble<1 || sesion.dobleActivo?'disabled':''}><span class="emoji">✨</span>${sesion.dobleActivo?'Activo':'x2 puntos'}</button>
      </div>
    `;
  }

  function activarPoderes(){
    if(!epico) return;
    document.getElementById('poderPista').onclick = () => {
      if(sesion.poderes.pista<1) return;
      sesion.poderes.pista--; sesion.powerupsUsados++;
      sonido('poder');
      const div = document.createElement('div');
      div.className = 'pista-texto';
      div.textContent = generarPista(sesion._actual);
      document.getElementById('tarjeta').appendChild(div);
      document.getElementById('poderPista').disabled = true;
    };
    document.getElementById('poderPausa').onclick = () => {
      if(sesion.poderes.pausa<1) return;
      sesion.poderes.pausa--; sesion.powerupsUsados++;
      sonido('poder');
      sesion.tiempoRestante += 15;
      document.getElementById('hudTiempo').textContent = formatoTiempo(sesion.tiempoRestante);
      document.getElementById('poderPausa').disabled = true;
    };
    document.getElementById('poderPocion').onclick = () => {
      if(sesion.poderes.pocion<1 || sesion.vidas>=sesion.vidasMax) return;
      sesion.poderes.pocion--; sesion.powerupsUsados++;
      sonido('poder');
      sesion.vidas = Math.min(sesion.vidasMax, sesion.vidas+1);
      document.querySelector('.hud-vidas').textContent = '❤️'.repeat(sesion.vidas) + '🖤'.repeat(sesion.vidasMax-sesion.vidas);
      document.getElementById('poderPocion').disabled = true;
    };
    document.getElementById('poderDoble').onclick = () => {
      if(sesion.poderes.doble<1 || sesion.dobleActivo) return;
      sesion.poderes.doble--; sesion.powerupsUsados++; sesion.dobleActivo = true;
      sonido('poder');
      document.getElementById('poderDoble').textContent = 'Activo';
      document.getElementById('poderDoble').disabled = true;
    };
  }

  function generarPista(p){
    if(p.tipoResp==='raices' || p.tipoResp==='punto'){
      return `Pista: uno de los dos valores es ${p.respuesta[0]}.`;
    }
    if(p.tipoResp==='numero' || p.tipoResp==='decimal'){
      const val = p.respuesta;
      return `Pista: el resultado es ${val<0?'negativo':(val>0?'positivo':'cero')}, parte entera ${Math.trunc(val)}.`;
    }
    return 'Sin pista disponible para este problema.';
  }

  function render(){
    const esJefeAhora = sesion.sala>5;
    marco.innerHTML = `
      <div class="hud">
        <div class="hud-jugador"><span class="dot" style="background:var(--${color})"></span>${escapeHtml(nombre)}</div>
        <div class="hud-vidas">${'❤️'.repeat(sesion.vidas)}${'🖤'.repeat(sesion.vidasMax-sesion.vidas)}</div>
        <div class="hud-puntaje" style="color:var(--${color})">${sesion.puntaje} pts</div>
        <div class="hud-tiempo" id="hudTiempo">${formatoTiempo(sesion.tiempoRestante)}</div>
      </div>
      <div class="progreso-salas">${renderProgreso()}</div>
      <div class="barra-tiempo-fondo"><div class="barra-tiempo" id="barraTiempo" style="width:${sesion.tiempoRestante/DURACION_PARTIDA*100}%"></div></div>
      ${esJefeAhora ? `<div class="jefe-banner">${JEFE_FINAL.criatura} Combate contra ${JEFE_FINAL.nombre}</div>` : ''}
      ${renderBarraJefe()}
      ${renderPoderes()}
      <div class="racha" id="racha"></div>
      <div id="zonaProblema"></div>
    `;
    activarPoderes();
    siguienteProblema();
  }

  function generarProblemaActual(){
    if(sesion.sala<=5) return GENERADORES_SALA[sesion.sala-1](sesion.facil);
    const eq = generarEcuacionJefe(sesion.facil);
    if(sesion.faseJefe===1) return problemaJefeFase1(eq, sesion.jefeSubIndice);
    return problemaJefeFase2(eq, sesion.jefeSubIndice);
  }

  function siguienteProblema(){
    const p = generarProblemaActual();
    sesion._actual = p;
    sesion._inicioMs = Date.now();
    const esJefe = sesion.sala>5;
    const zona = document.getElementById('zonaProblema');
    zona.innerHTML = `
      <div class="tarjeta-problema ${esJefe?'jefe':''}" id="tarjeta">
        <div class="problema-etiqueta">${p.etiqueta} · vale ${p.puntos} pts</div>
        <div class="problema-enunciado">${p.enunciado}</div>
        ${p.nota ? `<div class="problema-nota">${p.nota}</div>` : ''}
      </div>
      <div class="zona-respuesta">
        <input type="text" id="inputResp" autocomplete="off" placeholder="Escribe tu respuesta...">
        <button id="btnResponder">Verificar</button>
      </div>
      <div class="respuesta-correcta-txt" id="textoCorrecta"></div>
    `;
    const input = document.getElementById('inputResp');
    const boton = document.getElementById('btnResponder');
    input.focus();
    const enviar = () => responder(input.value);
    boton.onclick = enviar;
    input.onkeydown = (e) => { if(e.key==='Enter') enviar(); };
  }

  function terminar(){
    limpiarTemporizador();
    sonido(sesion.victoria ? 'victoria' : 'derrota');
    onFinish(sesion);
  }

  function responder(textoUsuario){
    const p = sesion._actual;
    const input = document.getElementById('inputResp');
    const boton = document.getElementById('btnResponder');
    const tarjeta = document.getElementById('tarjeta');
    if(input.disabled) return;
    if(textoUsuario.trim()===''){ input.focus(); return; }

    const ok = validarRespuesta(p, textoUsuario);
    input.disabled = true; boton.disabled = true;
    const esJefe = sesion.sala>5;

    if(ok){
      sonido('correcto');
      const segundos = (Date.now()-sesion._inicioMs)/1000;
      const bonoVelocidad = Math.max(0, Math.round(20 - segundos));
      sesion.racha++;
      sesion.rachaMax = Math.max(sesion.rachaMax, sesion.racha);
      const bonoRacha = sesion.racha>=3 ? Math.min((sesion.racha-2)*15, 60) : 0;
      let puntosGanados = p.puntos + bonoVelocidad + bonoRacha;
      if(sesion.dobleActivo){ puntosGanados *= 2; sesion.dobleActivo = false; }
      sesion.puntaje += puntosGanados;
      sesion.aciertos++;
      tarjeta.classList.add('correcto');
      input.classList.add('correcto');
      document.getElementById('racha').textContent = sesion.racha>=2 ? `🔥 Racha de ${sesion.racha}` : '';

      if(esJefe){
        const wrap = document.getElementById('jefeHpWrap');
        if(wrap) wrap.classList.add('impacto');
        const dano = document.getElementById('danoFlotante');
        if(dano) dano.textContent = `¡Golpe certero! (${sesion.jefeSubIndice+1}/4 de esta fase)`;
      }

      // avanzar
      if(sesion.sala<=5){
        sesion.sala++;
        if(sesion.sala>5){ sesion.faseJefe = 1; sesion.jefeSubIndice = 0; }
      } else {
        sesion.jefeSubIndice++;
        if(sesion.jefeSubIndice>=4){
          if(sesion.faseJefe===1){
            sesion.faseJefe = 2;
            sesion.jefeSubIndice = 0;
          } else {
            sesion.victoria = true;
            sesion.puntaje += sesion.tiempoRestante*2 + sesion.vidas*50; // bono final
            document.querySelector('.hud-puntaje').textContent = sesion.puntaje + ' pts';
            setTimeout(terminar, 700);
            return;
          }
        }
      }
    } else {
      sonido('incorrecto');
      sesion.racha = 0;
      sesion.errores++;
      sesion.vidas--;
      tarjeta.classList.add('incorrecto');
      input.classList.add('incorrecto');
      document.getElementById('racha').textContent = '';
      document.getElementById('textoCorrecta').innerHTML = `Respuesta correcta: <b>${escapeHtml(p.formatoCorrecta)}</b>`;
      if(esJefe){
        const dano = document.getElementById('danoFlotante');
        if(dano) dano.textContent = `💥 ¡El jefe contraataca! −1 vida`;
      }
    }

    document.querySelector('.hud-puntaje').textContent = sesion.puntaje + ' pts';
    document.querySelector('.hud-vidas').textContent = '❤️'.repeat(sesion.vidas) + '🖤'.repeat(sesion.vidasMax-sesion.vidas);

    if(!ok && sesion.vidas<=0){
      setTimeout(terminar, 1300);
      return;
    }

    const entrandoAlJefe = ok && sesion.sala===6 && sesion.faseJefe===1 && sesion.jefeSubIndice===0 && !sesion.introJefeMostrada;

    setTimeout(()=>{
      if(sesion.tiempoRestante<=0) return;
      if(entrandoAlJefe){
        sesion.introJefeMostrada = true;
        pantallaIntroJefe(color, render);
      } else {
        render();
      }
    }, ok ? 550 : 1300);
  }

  render();

  function tickReloj(){
    sesion.tiempoRestante--;
    const hud = document.getElementById('hudTiempo');
    const barra = document.getElementById('barraTiempo');
    if(hud) hud.textContent = formatoTiempo(sesion.tiempoRestante);
    if(barra) barra.style.width = (sesion.tiempoRestante/DURACION_PARTIDA*100)+'%';
    if(hud && sesion.tiempoRestante<=20) hud.classList.add('urgente');
    if(sesion.tiempoRestante<=0){
      terminar();
    }
  }
  temporizadorId = setInterval(tickReloj, 1000);

  function pantallaIntroJefe(colorTema, alContinuar){
    limpiarTemporizador(); // pausa el reloj durante la escena dramática
    sonido('rugido');
    marco.innerHTML = `
      <div class="jefe-intro">
        <div class="grieta">⚠ La cámara final tiembla ⚠</div>
        <div class="criatura">${JEFE_FINAL.criatura}</div>
        <div class="nombre-jefe">${JEFE_FINAL.nombre}</div>
        <div class="titulo-jefe">${JEFE_FINAL.titulo}</div>
        <div class="flavor">${JEFE_FINAL.flavor}</div>
        <div class="stats-jefe">
          <div class="stat-chip">🩸 8 golpes para vencerlo</div>
          <div class="stat-chip">🎭 2 fases</div>
          <div class="stat-chip">❤️ Tus vidas: ${sesion.vidas}/${sesion.vidasMax}</div>
        </div>
      </div>
      <button class="btn combate" id="btnEnfrentar">⚔️ ¡Enfréntalo!</button>
    `;
    document.getElementById('btnEnfrentar').onclick = () => {
      temporizadorId = setInterval(tickReloj, 1000); // reanuda el reloj
      alContinuar();
    };
  }
}

// "Coeficiente Cuadrático" — puntaje simbólico de diversión (no es un test de IQ real)
function calcularIQ(sesion){
  const totalResp = sesion.aciertos + sesion.errores;
  const precision = totalResp>0 ? sesion.aciertos/totalResp : 0;
  let iq = 90 + precision*40 + Math.min(sesion.rachaMax,10)*1.5 - sesion.errores*1.5 + (sesion.victoria?12:0);
  iq = Math.max(75, Math.min(160, Math.round(iq)));
  let etiqueta;
  if(iq<90) etiqueta = 'Aprendiz en entrenamiento 🌱';
  else if(iq<105) etiqueta = 'Pensador sólido 📘';
  else if(iq<120) etiqueta = 'Mente ágil ⚡';
  else if(iq<135) etiqueta = 'Genio matemático 🧠';
  else etiqueta = 'Leyenda de las cuadráticas 👑';
  return {iq, etiqueta};
}

function tarjetaIQHTML(sesion){
  const r = calcularIQ(sesion);
  return `
    <div class="tarjeta-iq">
      <div class="k">Coeficiente Cuadrático</div>
      <div class="valor">${r.iq}</div>
      <div class="etiqueta">${r.etiqueta}</div>
      <div class="nota">*Puntaje simbólico y de diversión, no es un test de inteligencia real.</div>
    </div>
  `;
}

function calcularLogros(sesion){
  const logros = [];
  if(sesion.victoria && sesion.errores===0) logros.push({e:'🎯', t:'Precisión perfecta — venciste sin ningún error'});
  if(sesion.victoria && sesion.vidas===sesion.vidasMax) logros.push({e:'🛡️', t:'Invicto — no perdiste ni una vida'});
  if(sesion.rachaMax>=6) logros.push({e:'🔥', t:`Racha imparable — ${sesion.rachaMax} respuestas seguidas`});
  if(sesion.victoria && sesion.tiempoRestante > DURACION_PARTIDA*0.5) logros.push({e:'⚡', t:'Velocista — venciste con más de la mitad del tiempo restante'});
  if(sesion.victoria && (sesion.powerupsUsados||0)===0 && sesion.epico) logros.push({e:'💪', t:'Sin ayuda — venciste sin usar ningún poder'});
  if(!sesion.victoria && sesion.aciertos>=5) logros.push({e:'🩹', t:'Casi lo logras — llegaste muy cerca del Jefe Final'});
  if(logros.length===0) logros.push({e:'📖', t:'Cada intento suma experiencia. ¡Vuelve a intentarlo!'});
  return logros;
}

function logrosHTML(sesion){
  return `<div class="logros">${calcularLogros(sesion).map(l=>`<div class="logro-item"><span class="emoji">${l.e}</span><span>${escapeHtml(l.t)}</span></div>`).join('')}</div>`;
}

function pantallaResultadoAventura(nombre, sesion){
  marco.innerHTML = `
    <div class="resultado-corona">${sesion.victoria ? '🏆' : '💀'}</div>
    <div class="resultado-titulo">${sesion.victoria ? '¡Venciste la mazmorra!' : 'La mazmorra te detuvo'}</div>
    <div class="resultado-sub">${descripcionProgreso(sesion)}</div>

    <div class="tabla-resultado">
      <div class="tarjeta-jugador ganador">
        <div class="nombre" style="color:var(--p1)">${escapeHtml(nombre)}</div>
        <div class="puntaje">${sesion.puntaje}</div>
        <div class="detalle">
          <b>${sesion.aciertos}</b> aciertos · <b>${sesion.errores}</b> errores<br>
          Racha máxima: <b>${sesion.rachaMax}</b><br>
          Vidas restantes: <b>${sesion.vidas}</b>
        </div>
      </div>
    </div>

    ${tarjetaIQHTML(sesion)}

    <div class="botonera">
      <button class="btn secundario" id="btnMenu">Menú principal</button>
      <button class="btn" id="btnRevancha">Intentar de nuevo</button>
    </div>
  `;
  document.getElementById('btnMenu').onclick = pantallaMenuPrincipal;
  document.getElementById('btnRevancha').onclick = pantallaInicioAventura;
}

function pantallaResultadoEpico(nombre, sesion){
  marco.innerHTML = `
    <div class="resultado-corona">${sesion.victoria ? '🏆' : '💀'}</div>
    <div class="resultado-titulo">${sesion.victoria ? '¡Venciste la mazmorra épica!' : 'El jefe te detuvo'}</div>
    <div class="resultado-sub">${descripcionProgreso(sesion)}</div>

    <div class="tabla-resultado">
      <div class="tarjeta-jugador ganador">
        <div class="nombre" style="color:var(--p1)">${escapeHtml(nombre)}</div>
        <div class="puntaje">${sesion.puntaje}</div>
        <div class="detalle">
          <b>${sesion.aciertos}</b> aciertos · <b>${sesion.errores}</b> errores<br>
          Racha máxima: <b>${sesion.rachaMax}</b><br>
          Vidas restantes: <b>${sesion.vidas}</b> · Poderes usados: <b>${sesion.powerupsUsados}</b>
        </div>
      </div>
    </div>

    <div class="problema-etiqueta" style="text-align:left;margin-bottom:8px;">🏅 Logros obtenidos</div>
    ${logrosHTML(sesion)}

    ${tarjetaIQHTML(sesion)}

    <div class="botonera">
      <button class="btn secundario" id="btnMenu">Menú principal</button>
      <button class="btn" id="btnRevancha">Intentar de nuevo</button>
    </div>
  `;
  document.getElementById('btnMenu').onclick = pantallaMenuPrincipal;
  document.getElementById('btnRevancha').onclick = pantallaInicioEpico;
}

function pantallaResultadoDuelo(){
  const r1 = estado.resultados[1], r2 = estado.resultados[2];
  const empate = r1.puntaje === r2.puntaje;
  const ganador1 = r1.puntaje > r2.puntaje;
  const iq1 = calcularIQ(r1), iq2 = calcularIQ(r2);

  marco.innerHTML = `
    <div class="resultado-corona">${empate ? '🤝' : '🏆'}</div>
    <div class="resultado-titulo">${empate ? '¡Empate legendario!' : `${escapeHtml(ganador1?estado.nombre1:estado.nombre2)} gana el duelo`}</div>
    <div class="resultado-sub">${empate ? 'Ambos retadores demostraron el mismo dominio de las cuadráticas.' : 'La mazmorra reconoce a su campeón.'}</div>

    <div class="tabla-resultado">
      <div class="tarjeta-jugador ${!empate && ganador1 ? 'ganador':''}">
        <div class="nombre" style="color:var(--p1)">${escapeHtml(estado.nombre1)}</div>
        <div class="puntaje">${r1.puntaje}</div>
        <div class="detalle">
          ${descripcionProgreso(r1)}<br>
          <b>${r1.aciertos}</b> aciertos · <b>${r1.errores}</b> errores<br>
          Racha máxima: <b>${r1.rachaMax}</b>
        </div>
      </div>
      <div class="tarjeta-jugador ${!empate && !ganador1 ? 'ganador':''}">
        <div class="nombre" style="color:var(--p2)">${escapeHtml(estado.nombre2)}</div>
        <div class="puntaje">${r2.puntaje}</div>
        <div class="detalle">
          ${descripcionProgreso(r2)}<br>
          <b>${r2.aciertos}</b> aciertos · <b>${r2.errores}</b> errores<br>
          Racha máxima: <b>${r2.rachaMax}</b>
        </div>
      </div>
    </div>

    <div class="tarjeta-iq doble">
      <div class="lado">
        <div class="k">${escapeHtml(estado.nombre1)}</div>
        <div class="valor" style="color:var(--p1)">${iq1.iq}</div>
        <div class="etiqueta">${iq1.etiqueta}</div>
      </div>
      <div class="lado">
        <div class="k">${escapeHtml(estado.nombre2)}</div>
        <div class="valor" style="color:var(--p2)">${iq2.iq}</div>
        <div class="etiqueta">${iq2.etiqueta}</div>
      </div>
    </div>
    <div class="tarjeta-iq" style="padding:6px;margin-top:-14px;background:none;border:none;">
      <div class="nota">*Coeficiente Cuadrático: puntaje simbólico y de diversión, no es un test de inteligencia real.</div>
    </div>

    <div class="botonera">
      <button class="btn secundario" id="btnMenu">Menú principal</button>
      <button class="btn" id="btnRevancha">Revancha</button>
    </div>
  `;
  document.getElementById('btnMenu').onclick = pantallaMenuPrincipal;
  document.getElementById('btnRevancha').onclick = () => pantallaIntermezzo(1);
}

/* ===================== UTIL ===================== */
function formatoTiempo(s){
  const m = Math.floor(s/60), r = s%60;
  return `${m}:${String(r).padStart(2,'0')}`;
}
function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

pantallaMenuPrincipal();
</script>
